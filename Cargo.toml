[package]
name = "lynshen-cli"
version.workspace = true
license.workspace = true
authors.workspace = true
edition = "2021"

[[bin]]
name = "lynshen"
path = "src/main.rs"

[workspace]
members = [".", "crates/agent-core", "crates/daemon", "crates/llm-provider-kit", "crates/software-release", "crates/tui"]
resolver = "2"

[workspace.package]
version = "0.4.16"
license = "Apache-2.0"
authors = ["LynShen Innovations INC."]

[dependencies]
lynshen-agent-core = { path = "crates/agent-core" }
lynshen-daemon = { path = "crates/daemon" }
lynshen-tui = { path = "crates/tui" }
serde_json = "1"
tungstenite = "0.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
